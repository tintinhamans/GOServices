name: Container image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push linux/amd64 image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Name the image and tag
      id: names
      run: |
        echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/genonlineservice" >> "$GITHUB_OUTPUT"
        echo "short_sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

    - name: Image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.names.outputs.image }}
        tags: |
          type=raw,value=${{ steps.names.outputs.short_sha }}
          type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
          type=semver,pattern={{version}}

    - uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
