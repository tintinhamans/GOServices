name: Release artifact

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Publish linux-x64 artifact
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish
      run: dotnet publish GenOnlineService/GenOnlineService.csproj -c Release -r linux-x64 --self-contained false -o out

    - name: Package
      id: pack
      run: |
        short_sha="$(git rev-parse --short=8 HEAD)"
        name="genonlineservice-${short_sha}-linux-x64.tar.gz"
        tar -czf "${name}" -C out .
        sha256sum "${name}" > "${name}.sha256"
        echo "name=${name}" >> "$GITHUB_OUTPUT"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.pack.outputs.name }}
        path: |
          ${{ steps.pack.outputs.name }}
          ${{ steps.pack.outputs.name }}.sha256

    - name: Attach to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.pack.outputs.name }}
          ${{ steps.pack.outputs.name }}.sha256
